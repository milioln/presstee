<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Site en maintenance — Presstee</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F1FA;color:#17131F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px}
  .card{max-width:460px;text-align:center;background:#fff;border-radius:18px;padding:44px 36px;box-shadow:0 8px 32px rgba(23,19,31,.08)}
  .logo{width:160px;height:auto;margin-bottom:28px}
  h1{font-size:1.4rem;letter-spacing:-0.02em;margin-bottom:12px}
  p{color:#6C6580;line-height:1.6;margin-bottom:8px}
  .contact{margin-top:20px;padding-top:20px;border-top:1px solid #E7E3F2;font-size:.92rem;color:#6C6580}
  .contact a{color:#17131F;font-weight:600;text-decoration:none}
  .contact a:hover{color:#9d83cf}
  .badge{display:inline-block;margin-top:20px;padding:6px 16px;border-radius:999px;background:#ffd77a;font-size:.8rem;font-weight:600;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo/presstee-horizontal.svg" alt="Presstee" />
    <h1>Site temporairement indisponible.</h1>
    <p>Nous effectuons une mise à jour. Le site sera de retour très prochainement — merci de votre patience.</p>
    <div class="contact">
      Besoin de nous joindre en attendant ?<br />
      <a href="mailto:contact@presstee.fr">contact@presstee.fr</a>
    </div>
    <span class="badge">Retour bientôt</span>
  </div>
</body>
</html>
