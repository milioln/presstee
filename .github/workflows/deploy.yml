name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm ci

      - name: Build du site
        run: npm run build

      # OVH mutualisé ne compile pas et ne détecte pas les push : le dossier
      # dist/ compilé ici est déposé par FTPS dans le dossier www.
      # Secrets attendus dans les paramètres GitHub du dépôt (jamais dans le code) :
      #   OVH_FTP_SERVER   → ftp.cluster0XX.hosting.ovh.net (ou l'hôte fourni par OVH)
      #   OVH_FTP_USERNAME
      #   OVH_FTP_PASSWORD
      - name: Déploiement FTPS vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /www/
